name: outage-watch

on:
  schedule:
    - cron: "*/10 * * * *"   # кожні ~10 хв (GitHub може запізнюватись на кілька хвилин)
  workflow_dispatch:          # ручний запуск кнопкою

permissions:
  contents: write

concurrency:
  group: outage-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Перевірити канал і надіслати в групу
        run: python watch.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QUEUE: "4.1"
          # GEMINI_MODEL: "gemini-2.5-flash"   # якщо основна модель недоступна
          SEND_LAST: "1"   # розкоментуйте для першого тесту, потім приберіть
      - name: Зберегти стан
        run: |
          git config user.name "outage-bot"
          git config user.email "outage-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
